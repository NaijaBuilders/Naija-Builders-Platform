---
deployment:
  tasks:
    - export REPOPATH=/home2/naija4b5/repositories/Naija-Builders-Platform/laravel-app/
    - export DEPLOYPATH=/home2/naija4b5/api-dev.naijabuilders.com/
    # Copy the Laravel app over the live folder. Server-only files (.env, storage, vendor)
    # are left alone and nothing on the server is deleted.
    - rsync -rlt --exclude='.env' --exclude='.env.*' --exclude='storage/' --exclude='vendor/' --exclude='node_modules/' --exclude='tests/' --exclude='bootstrap/cache/*.php' $REPOPATH $DEPLOYPATH
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:clear
